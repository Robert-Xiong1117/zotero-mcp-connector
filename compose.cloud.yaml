services:
  zotero-cloud:
    build:
      context: .
      dockerfile: Dockerfile.cloud
    env_file: .env.cloud
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - zotero-oauth:/data
    mem_limit: 768m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  zotero-oauth:
