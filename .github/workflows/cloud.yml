name: cloud-mcp
on:
  push:
    branches: [main, 'cloud/**']
    paths: ['cloud/**', 'cloud_tests/**', 'requirements-cloud.txt', 'Dockerfile.cloud', '.github/workflows/cloud.yml']
  pull_request:
    paths: ['cloud/**', 'cloud_tests/**', 'requirements-cloud.txt', 'Dockerfile.cloud', '.github/workflows/cloud.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-cloud.txt
      - run: python -m unittest discover -s cloud_tests -v
      - run: docker build -f Dockerfile.cloud -t zotero-cloud:test .
